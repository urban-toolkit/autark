<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autark (Heat Islands)</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div id="app">
        <div id="loading-overlay" role="status" aria-live="polite">
            <div id="loading-box">
                <div id="loading-spinner"></div>
                <h2 id="loading-title">Loading</h2>
                <p id="loading-text"></p>
                <p id="loading-note"></p>
            </div>
        </div>
        <canvas aria-label="Niterói temperature map"></canvas>
        <button id="plotToggle" title="Toggle plots" aria-label="Toggle plots">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 40 40">
                <polyline points="4,34 14,18 22,26 32,10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <line x1="4" y1="36" x2="36" y2="36" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </button>
        <div id="controlPanel">
            <div id="panelBody">
                <div class="panel-section">
                    <label class="panel-section-title" for="yearSelect">Year</label>
                    <select id="yearSelect"></select>
                </div>
                <div class="panel-section">
                    <div class="panel-section-title">Roads Color</div>
                    <label class="panel-checkbox">
                        <input type="checkbox" id="angleToggle" checked>
                        Regression angle (°)
                    </label>
                </div>
            </div>
        </div>
        <div id="plotPanel">
            <div id="plotBar"></div>
            <div id="plotBody"></div>
            <div id="linePlotBody"></div>
        </div>
    </div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
