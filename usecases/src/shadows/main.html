<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autark (Shadows)</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div id="app">
        <div id="loading-overlay" role="status" aria-live="polite">
            <div id="loading-box">
                <div id="loading-spinner"></div>
                <h2 id="loading-title">Loading</h2>
                <p id="loading-text"></p>
                <p id="loading-note"></p>
            </div>
        </div>
        <canvas aria-label="Chicago shadow map"></canvas>
        <div id="controls">
            <div id="displayMode">
                <label><input type="radio" name="mode" value="heatmap" checked> Shadow heatmap</label>
                <label><input type="radio" name="mode" value="compute"> Building shadow (min)</label>
                <label><input type="radio" name="mode" value="contribution"> Building shadow (%)</label>
            </div>
            <select id="monthSelect" aria-label="Month"></select>
        </div>
        <div id="histogramPanel">
            <div id="histogramBar"></div>
            <div id="histogramBody"></div>
        </div>
    </div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
