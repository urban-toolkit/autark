<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Autark Cross-Origin (Jupyter-like) Test</title>
</head>
<body>
    <h1>Cross-Origin Runtime Test (simulates Jupyter on another port)</h1>
    <div id="status" data-state="loading">Loading...</div>
    <div id="container" style="width: 100%; height: 500px; border: 1px solid #ddd;"></div>

    <script type="module">
        const status = document.getElementById('status');
        try {
            // Runtime loaded cross-origin, exactly like a Jupyter cell on :8888
            const { AutarkRuntime } = await import('http://localhost:8000/autk-runtime/dist/autk-runtime.js');

            const spec = {
                "$schema": "https://urban-toolkit.github.io/autark/schema/autark-spec-v0.1.json",
                "version": "0.1",
                "metadata": { "title": "Cross-origin test" },
                "workspace": { "name": "xorigin", "coordinateFormat": "EPSG:4326" },
                "data": [{
                    "name": "neighborhoods",
                    "url": "http://localhost:8000/examples/data/neighborhoods.geojson",
                    "layerType": "polygons",
                    "coordinateFormat": "EPSG:4326",
                    "type": "geojson"
                }],
                "views": [{
                    "type": "map",
                    "name": "test_map",
                    "camera": { "pitch": 0, "bearing": 0, "zoom": 12 },
                    "layers": [{
                        "source": "neighborhoods",
                        "id": "neighborhoods_layer",
                        "type": "polygons",
                        "style": { "color": "#4a90e2", "opacity": 0.7 }
                    }]
                }]
            };

            const container = document.getElementById('container');
            await AutarkRuntime.fromSpec(spec, { container });
            status.textContent = 'SUCCESS';
            status.dataset.state = 'success';
        } catch (error) {
            status.textContent = 'ERROR: ' + (error && error.message ? error.message : error);
            status.dataset.state = 'error';
            console.error(error);
        }
    </script>
</body>
</html>
