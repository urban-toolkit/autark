[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autark"
version = "0.1.0a0"
description = "Python builders for Autark declarative specifications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Urban Toolkit" }
]
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.0"]
widget = ["anywidget>=0.9"]
test = ["jsonschema>=4.0"]
dev = ["jsonschema>=4.0", "anywidget>=0.9", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["autark*"]

[tool.setuptools.package-data]
autark = ["static/*.js"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["autark"]
# Notebook/display integrations return third-party objects.
[[tool.mypy.overrides]]
module = ["anywidget", "traitlets", "jsonschema"]
ignore_missing_imports = true
