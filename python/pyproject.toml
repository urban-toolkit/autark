[build-system]
requires = ["hatchling>=1.24", "hatch-jupyter-builder>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "autark"
version = "0.1.0a0"
description = "Declarative Python API for urban visual analytics (maps, plots, spatial joins) rendered with WebGPU and DuckDB-WASM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Urban Toolkit" }
]
keywords = ["visualization", "maps", "gis", "urban", "duckdb", "webgpu", "jupyter", "declarative"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: Jupyter",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/urban-toolkit/autark"
Repository = "https://github.com/urban-toolkit/autark"
Issues = "https://github.com/urban-toolkit/autark/issues"

[project.optional-dependencies]
validation = ["jsonschema>=4.0"]
widget = ["anywidget>=0.9"]
test = ["jsonschema>=4.0"]
dev = ["jsonschema>=4.0", "anywidget>=0.9", "mypy>=1.8", "nbformat>=5.0", "nbclient>=0.7"]

[tool.hatch.build]
only-packages = true
artifacts = ["autark/static/autark-widget.js"]

[tool.hatch.build.targets.wheel]
packages = ["autark"]

[tool.hatch.build.targets.sdist]
include = ["autark", "README.md", "pyproject.toml"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["autark/static/autark-widget.js"]
skip-if-exists = ["autark/static/autark-widget.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "../autk-runtime"
npm = "npm"
build_cmd = "build:widget"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["autark"]
# Notebook/display integrations return third-party objects.
[[tool.mypy.overrides]]
module = ["anywidget", "traitlets", "jsonschema"]
ignore_missing_imports = true
