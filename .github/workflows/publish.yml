name: Publish to npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Disabled unless a maintainer explicitly sets NPM_RELEASE_ENABLED=true.
permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify release candidate
    if: >-
      ${{ vars.NPM_RELEASE_ENABLED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      run_id: ${{ steps.ci.outputs.run_id }}
      run_attempt: ${{ steps.ci.outputs.run_attempt }}
      artifact: ${{ steps.ci.outputs.artifact }}
      has_release: ${{ steps.ci.outputs.has_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - run: npm install --global npm@12.2.0
      - run: npm ci --ignore-scripts
      - name: Inspect the successful CI run and version changes
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node .github/scripts/resolve-release-run.mjs

  stage:
    name: Stage tested packages for npm approval
    needs: candidate
    if: needs.candidate.outputs.has_release == 'true'
    environment: npm-release
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0
      - run: npm ci --ignore-scripts
      - name: Download artifacts from the verified CI attempt
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          run-id: ${{ needs.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/npm-release
      - name: Preflight and stage (never approve or publish directly)
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_RUN_ID: ${{ needs.candidate.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ needs.candidate.outputs.run_attempt }}
        run: node .github/scripts/release.mjs stage "$RUNNER_TEMP/npm-release"
