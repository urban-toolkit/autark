name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, typecheck, build, and validate packages
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build and typecheck
        run: make typecheck

      - name: Validate package artifacts
        run: npm run validate:packages

      - name: Pack packages
        run: npm run pack:packages

      - name: Test isolated npm consumers
        run: npm run test:packages

      - name: Upload tested release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/npm-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
