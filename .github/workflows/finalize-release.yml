name: Finalize npm release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run ID whose staged packages were approved on npm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  candidate:
    if: vars.NPM_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      run_id: ${{ steps.ci.outputs.run_id }}
      run_attempt: ${{ steps.ci.outputs.run_attempt }}
      artifact: ${{ steps.ci.outputs.artifact }}
      has_release: ${{ steps.ci.outputs.has_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - name: Verify original CI execution
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node .github/scripts/resolve-release-run.mjs

  tags:
    needs: candidate
    if: needs.candidate.outputs.has_release == 'true'
    environment: npm-release
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          run-id: ${{ needs.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/npm-release
      - name: Verify public npm versions and atomically create Git tags
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_RUN_ID: ${{ needs.candidate.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ needs.candidate.outputs.run_attempt }}
        run: node .github/scripts/release.mjs finalize "$RUNNER_TEMP/npm-release"
